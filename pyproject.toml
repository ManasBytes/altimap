[project]
name = "altimap"
version = "0.1.0"
description = "Single-view optical imagery to metric elevation models"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.3",
    "rasterio==1.5.1",
    "scipy==1.18.1",
    "scikit-image==0.26.0",
    "pystac-client==0.9.0",
    "planetary-computer==1.0.0",
    "shapely==2.1.2",
]

[project.scripts]
altimap-eval = "altimap.eval.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/altimap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires network access to Planetary Computer",
]
